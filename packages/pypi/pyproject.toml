[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parseaddr"
version = "0.1.0"
description = "Parse messy postal addresses into structured fields with the hosted ParseAddr (libpostal) API. Includes a stdio MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ParseAddr" }]
keywords = ["address", "address-parser", "libpostal", "parsing", "postal", "normalization", "mcp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# `pip install "parseaddr[mcp]"` to run the stdio MCP server for coding agents.
mcp = ["mcp>=1.2,<2"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://parseaddr.com"
Documentation = "https://api.parseaddr.com/docs"
Repository = "https://github.com/wezpyke/parseaddr-mcp"
Issues = "https://github.com/wezpyke/parseaddr-mcp/issues"

[project.scripts]
# MCP registry / Smithery launch this stdio server.
parseaddr-mcp = "parseaddr.server:main"

[tool.hatch.build.targets.sdist]
include = ["parseaddr/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

